<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un regalito para ti <3 </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --space-void:#05060f;
    --space-deep:#0c1130;
    --star-white:#eef4ff;
    --nova-blue:#4fc3ff;
    --nebula-violet:#8a6dff;
    --comet-teal:#37e6c7;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    min-height:100vh;
    font-family:'Space Grotesk', sans-serif;
    background:
      radial-gradient(ellipse 60% 45% at 30% 20%, rgba(138,109,255,.14), transparent 70%),
      radial-gradient(ellipse 50% 40% at 75% 80%, rgba(79,195,255,.12), transparent 70%),
      var(--space-void);
    color:var(--star-white);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    overflow:hidden;
    position:relative;
  }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(180,210,255,.75) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(140,160,255,.65) 0 1px, transparent 1.5px);
    background-size: 97px 113px, 151px 137px, 211px 179px;
    background-position: 13px 29px, 71px 11px, 31px 83px;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ 0%{ opacity:.65; } 100%{ opacity:1; } }

  .shoot-star{
    position:fixed;
    border-radius:50%;
    background:var(--star-white);
    z-index:1;
    pointer-events:none;
    animation:shootFly var(--dur, 1.2s) cubic-bezier(.2,.6,.35,1) forwards;
  }
  .shoot-tail{
    position:absolute;
    top:50%; left:50%;
    height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,.95), rgba(180,210,255,.35) 55%, transparent);
    border-radius:2px;
    filter:blur(.2px);
  }
  @keyframes shootFly{
    0%{ transform:translate(0,0); opacity:0; filter:brightness(1); }
    6%{ opacity:1; }
    50%{ filter:brightness(1.6); }
    88%{ opacity:1; }
    100%{ transform:translate(var(--tx), var(--ty)); opacity:0; }
  }

  .falling-star{
    position:fixed;
    top:-5%;
    pointer-events:none;
    z-index:1;
    animation:fallDown linear infinite;
  }
  @keyframes fallDown{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:.9; }
    100%{ transform:translateY(115vh) translateX(var(--drift, 0px)); opacity:0; }
  }

  .scene{ position:relative; z-index:2; text-align:center; max-width:380px; width:100%; }

  .gift-wrap{
    background:none; border:none; padding:0; margin:0 auto;
    font:inherit; color:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .gift-wrap:focus-visible{ outline:2px solid var(--nova-blue); outline-offset:6px; }

  .gift-box{
    width:150px; height:118px;
    position:relative;
    transition:transform .25s ease;
  }
  .gift-wrap:hover .gift-box{ transform:translateY(-4px); }

  .box-body{
    position:absolute; left:0; right:0; bottom:0; height:86px;
    background:linear-gradient(160deg, #182563, var(--space-deep));
    border:1px solid rgba(79,195,255,.4);
    border-radius:8px;
    box-shadow:0 0 34px rgba(79,195,255,.15), inset 0 0 18px rgba(79,195,255,.08);
  }
  .box-body::after{
    content:''; position:absolute; inset:-40px; border-radius:50%;
    background:radial-gradient(circle, rgba(79,195,255,.55), transparent 70%);
    opacity:0;
  }
  .gift-box.opening .box-body::after{ animation:glowPulse .7s ease-out; }
  @keyframes glowPulse{ 0%{ opacity:0; transform:scale(.3);} 40%{ opacity:1;} 100%{ opacity:0; transform:scale(1.9);} }

  .box-lid{
    position:absolute; left:-7px; right:-7px; top:20px; height:26px;
    background:linear-gradient(160deg, #223080, var(--space-deep));
    border:1px solid rgba(79,195,255,.5);
    border-radius:7px;
    transform-origin:50% 100%;
    transition:transform .6s cubic-bezier(.34,1.56,.64,1), opacity .45s ease;
    box-shadow:0 0 20px rgba(79,195,255,.2);
  }
  .gift-box.opening .box-lid{ transform:translateY(-46px) rotateX(65deg); opacity:0; }

  .ribbon-v{
    position:absolute; top:0; bottom:0; left:50%; width:14px; margin-left:-7px;
    background:linear-gradient(180deg, var(--nova-blue), var(--nebula-violet));
    transition:opacity .35s ease, transform .45s ease;
  }
  .ribbon-h{
    position:absolute; left:0; right:0; top:20px; height:14px;
    background:linear-gradient(90deg, var(--nova-blue), var(--nebula-violet));
    transition:opacity .35s ease, transform .45s ease;
  }
  .gift-box.opening .ribbon-v{ opacity:0; transform:scaleY(0); }
  .gift-box.opening .ribbon-h{ opacity:0; transform:scaleX(0); }

  .bow{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:36px; height:20px; transition:opacity .3s ease, transform .4s ease; }
  .bow::before, .bow::after{
    content:''; position:absolute; top:0; width:16px; height:16px;
    background:var(--nebula-violet);
    border-radius:50% 50% 50% 0;
  }
  .bow::before{ left:0; transform:rotate(-40deg); }
  .bow::after{ right:0; transform:rotate(40deg) scaleX(-1); }
  .gift-box.opening .bow{ opacity:0; transform:translate(-50%,-24px) scale(.6); }

  .gift-hint{
    font-size:.8rem; letter-spacing:.06em; color:rgba(238,244,255,.65);
    transition:opacity .3s ease;
  }

  .burst-star{
    position:fixed; pointer-events:none; z-index:5;
    animation:burst 900ms ease-out forwards;
  }
  @keyframes burst{
    0%{ transform:translate(0,0) scale(0); opacity:1; }
    55%{ opacity:1; }
    100%{ transform:translate(var(--tx), var(--ty)) scale(1); opacity:0; }
  }

  .reveal-card{ display:none; }
  .reveal-card.visible{ display:block; animation:cardIn .6s ease; }
  @keyframes cardIn{ from{ opacity:0; transform:scale(.88) translateY(10px);} to{ opacity:1; transform:none;} }

  .reveal-eyebrow{
    font-size:.7rem; letter-spacing:.35em; text-transform:uppercase;
    color:var(--nova-blue); margin-bottom:10px;
  }
  .reveal-title{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    font-size:clamp(1.9rem, 6vw, 2.5rem);
    margin:0 0 16px;
    text-shadow:0 0 26px rgba(79,195,255,.4);
  }
  .reveal-note{
    font-size:.92rem; line-height:1.65; opacity:.85;
    max-width:320px; margin:0 auto 26px;
  }

  .gift-code-block{
    border:1px dashed var(--nova-blue);
    border-radius:10px;
    padding:16px 18px;
    text-align:left;
  }
  .thanks-img{
    display:block;
    max-width:200px; width:70%;
    margin:22px auto 4px;
    border-radius:14px;
    border:2px solid var(--nova-blue);
    box-shadow:0 0 28px rgba(79,195,255,.35);
    animation:cardIn .5s ease;
  }
  .gift-code-label{
    font-size:.7rem; letter-spacing:.08em; color:rgba(238,244,255,.6);
    margin-bottom:8px;
  }
  .gift-code-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .gift-code{
    font-family:'Space Grotesk', monospace;
    font-size:1rem; font-weight:700;
    color:var(--star-white);
    letter-spacing:.04em;
    background:rgba(79,195,255,.1);
    padding:6px 10px; border-radius:6px;
    word-break:break-all;
  }
  .copy-btn2{
    border:1px solid var(--nova-blue);
    background:transparent; color:var(--nova-blue);
    padding:7px 14px; border-radius:6px; font-size:.75rem;
    font-family:inherit; cursor:pointer;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .copy-btn2:hover{ background:rgba(79,195,255,.12); }
  .copy-btn2.copied{ background:var(--nova-blue); color:var(--space-void); }
  .copy-btn2:focus-visible{ outline:2px solid var(--star-white); outline-offset:2px; }

  @media (prefers-reduced-motion:reduce){
    .stars{ animation:none; }
    .shoot-star{ display:none; }
    .falling-star{ display:none; }
    .burst-star{ display:none; }
    .box-lid, .ribbon-v, .ribbon-h, .bow, .box-body::after{ transition:none; animation:none; }
  }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>

<div class="scene">
  <button class="gift-wrap" id="giftWrap" aria-label="Abrir regalo">
    <div class="gift-box" id="giftBox">
      <div class="box-body"></div>
      <div class="box-lid"></div>
      <div class="ribbon-v"></div>
      <div class="ribbon-h"></div>
      <div class="bow"></div>
    </div>
    <p class="gift-hint" id="giftHint">toca para abrir ✦</p>
  </button>

  <div class="reveal-card" id="revealCard">
    <div class="reveal-eyebrow">un regalito más</div>
    <h1 class="reveal-title">Para ti, Bae</h1>
    <p class="reveal-note">Porque deseo seguir construyendo cosas contigo corazón. 💙</p>
    <div class="gift-code-block">
      <div class="gift-code-label">🎮 MINECRAFT</div>
      <div class="gift-code-row">
        <span class="gift-code" id="giftCode2"></span>
        <button class="copy-btn2" id="copyBtn2">Copiar</button>
      </div>
    </div>
    <img src="gracias.jpg" alt="" class="thanks-img" onerror="this.style.display='none'">
  </div>
</div>

<script>
  /* ======================================================
  // Sepa la bola que estoy o voy a hacer aqui T.T :SOB
  ====================================================== */
  const GIFT_CODE = "PON-AQUI-TU-CODIGO";

  const giftWrap = document.getElementById('giftWrap');
  const giftBox = document.getElementById('giftBox');
  const giftHint = document.getElementById('giftHint');
  const revealCard = document.getElementById('revealCard');
  const giftCodeEl = document.getElementById('giftCode2');
  let opened = false;

  function burstStars(rect){
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const glyphs = ['✦','✧','⋆','✶'];
    const colors = ['var(--nova-blue)','var(--nebula-violet)','var(--comet-teal)','var(--star-white)'];
    for (let i = 0; i < 26; i++){
      const el = document.createElement('div');
      el.className = 'burst-star';
      el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.fontSize = (10 + Math.random() * 14) + 'px';
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 150;
      el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  giftWrap.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    giftBox.classList.add('opening');
    giftHint.style.opacity = '0';
    burstStars(giftBox.getBoundingClientRect());
    setTimeout(() => {
      giftWrap.style.display = 'none';
      giftCodeEl.textContent = GIFT_CODE;
      revealCard.classList.add('visible');
    }, 650);
  });

  const copyBtn2 = document.getElementById('copyBtn2');
  copyBtn2.addEventListener('click', () => {
    navigator.clipboard.writeText(giftCodeEl.textContent).then(() => {
      copyBtn2.textContent = '✔ Copiado';
      copyBtn2.classList.add('copied');
      setTimeout(() => {
        copyBtn2.textContent = 'Copiar';
        copyBtn2.classList.remove('copied');
      }, 1800);
    }).catch(() => {
      copyBtn2.textContent = 'selecciona y copia';
    });
  });

  /* ---------- lluvia de estrellas de fondo ---------- */
  function spawnFallingStars(count){
    const glyphs = ['✦', '✧', '⋆', '·', '✶'];
    const colors = ['var(--star-white)', 'var(--nova-blue)', 'var(--nebula-violet)', 'var(--comet-teal)'];
    for (let i = 0; i < count; i++){
      const el = document.createElement('div');
      el.className = 'falling-star';
      el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (6 + Math.random() * 13) + 'px';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      const duration = 8 + Math.random() * 12;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (-Math.random() * duration) + 's';
      document.body.appendChild(el);
    }
  }
  const fallingCount = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 30;
  spawnFallingStars(fallingCount);

  /* ---------- FALLING STARS COMO YO STAR-DUST... Ok, chiste malardo---------- */
  function spawnShootingStar(){
    const el = document.createElement('div');
    el.className = 'shoot-star';

    const startX = Math.random() * 75;
    const startY = Math.random() * 40;
    el.style.left = startX + 'vw';
    el.style.top = startY + 'vh';

    const size = 2 + Math.random() * 2.5;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.boxShadow = `0 0 ${5 + size * 2}px ${1 + size / 2}px rgba(255,255,255,.9)`;

    const angleDeg = 18 + Math.random() * 40;
    const distance = 200 + Math.random() * 300;
    const rad = angleDeg * Math.PI / 180;
    const tx = Math.cos(rad) * distance;
    const ty = Math.sin(rad) * distance;
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');

    const dur = 1 + Math.random() * 0.8;
    el.style.setProperty('--dur', dur + 's');

    const tail = document.createElement('div');
    tail.className = 'shoot-tail';
    tail.style.width = (50 + Math.random() * 60) + 'px';
    tail.style.transform = `translateY(-50%) rotate(${angleDeg + 180}deg)`;
    el.appendChild(tail);

    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 150);
  }

  function scheduleShootingStars(){
    const burst = Math.random() < 0.25 ? 2 : 1;
    for (let i = 0; i < burst; i++){
      setTimeout(spawnShootingStar, i * 220);
    }
    setTimeout(scheduleShootingStars, 1400 + Math.random() * 2600);
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setTimeout(scheduleShootingStars, 700);
  }
</script>
</body>
</html>
